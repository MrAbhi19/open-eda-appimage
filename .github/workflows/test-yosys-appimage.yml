# Workflow to test Yosys AppImage by synthesizing picorv32
name: Test Yosys AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yosys Version to test (e.g. 0.69)'
        required: true
        default: '0.69'
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            appimage_arch: x86_64
          - os: ubuntu-22.04-arm
            appimage_arch: aarch64
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libfuse2 is required for AppImages on Ubuntu 22.04+
          sudo apt-get install -y wget curl git python3 libfuse2

      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download Yosys AppImage
        id: download
        env:
          YOSYS_VERSION: ${{ inputs.version }}
        run: |
          APPIMAGE_URL="https://github.com/${{ github.repository }}/releases/download/yosys-v${YOSYS_VERSION}/yosys-${YOSYS_VERSION}-${{ matrix.appimage_arch }}.AppImage"
          echo "Downloading from: $APPIMAGE_URL"
          if ! wget -q "$APPIMAGE_URL" -O yosys.AppImage; then
            echo "AppImage not found for ${APPIMAGE_URL}. Skipping tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x yosys.AppImage
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download picorv32 source
        if: steps.download.outputs.skip != 'true'
        run: |
          wget -q https://raw.githubusercontent.com/YosysHQ/picorv32/master/picorv32.v

      - name: Create Synthesis Script
        if: steps.download.outputs.skip != 'true'
        run: |
          cat << 'EOF' > synth.ys
          read_verilog picorv32.v
          synth -top picorv32
          stat
          EOF

      - name: Test AppImage and Synthesize
        if: steps.download.outputs.skip != 'true'
        run: |
          ./yosys.AppImage --version
          ./yosys.AppImage -s synth.ys

      - name: Append Verification to Release
        if: steps.download.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yosys-v${{ inputs.version }}
          append_body: true
          body: |

            ✅ **Verified**: Passed synthesis tests on `${{ matrix.appimage_arch }}`.
