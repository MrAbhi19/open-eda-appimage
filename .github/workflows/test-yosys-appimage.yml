# Workflow to test Yosys AppImage by synthesizing picorv32
name: Test Yosys AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yosys Version to test (e.g. 0.69)'
        required: true
        default: '0.69'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Download Yosys AppImage and picorv32 source
        uses: actions/github-script@v7
        env:
          APPIMAGE_URL: "https://github.com/${{ github.repository }}/releases/download/yosys-v${{ inputs.version }}/yosys-${{ inputs.version }}-x86_64.AppImage"
        with:
          script: |
            const fs = require('fs');

            async function download(url, dest) {
              const res = await fetch(url);
              if (res.status === 301 || res.status === 302) {
                return download(res.headers.get('location'), dest);
              }
              if (!res.ok) throw new Error(`unexpected response ${res.statusText}`);
              const buffer = Buffer.from(await res.arrayBuffer());
              fs.writeFileSync(dest, buffer);
            }

            const appimageUrl = process.env.APPIMAGE_URL;
            const picorv32Url = "https://raw.githubusercontent.com/YosysHQ/picorv32/master/picorv32.v";

            console.log(`Downloading ${appimageUrl}`);
            await download(appimageUrl, 'yosys.AppImage');
            fs.chmodSync('yosys.AppImage', 0o755);

            console.log(`Downloading ${picorv32Url}`);
            await download(picorv32Url, 'picorv32.v');

      - name: Create Synthesis Script
        run: |
          cat << 'TCL_EOF' > synth.tcl
          read_verilog picorv32.v
          synth -top picorv32
          stat
          TCL_EOF

      - name: Test AppImage Extract and Synthesize
        run: |
          # FUSE is not installed, so use --appimage-extract-and-run
          APPIMAGE_EXTRACT_AND_RUN=1 ./yosys.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./yosys.AppImage -c synth.tcl
