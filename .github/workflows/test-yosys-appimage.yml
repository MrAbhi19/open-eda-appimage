# Workflow to test Yosys AppImage by synthesizing picorv32
name: Test Yosys AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yosys Version to test (e.g. 0.69)'
        required: true
        default: '0.69'
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            appimage_arch: x86_64
          - os: ubuntu-22.04-arm
            appimage_arch: aarch64
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libfuse2 is required for AppImages on Ubuntu 22.04+
          sudo apt-get install -y wget curl git python3 libfuse2

      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download Yosys AppImage
        id: download
        env:
          YOSYS_VERSION: ${{ inputs.version }}
        run: |
          APPIMAGE_URL="https://github.com/${{ github.repository }}/releases/download/yosys-v${YOSYS_VERSION}/yosys-${YOSYS_VERSION}-${{ matrix.appimage_arch }}.AppImage"
          echo "Downloading from: $APPIMAGE_URL"
          if ! wget -q "$APPIMAGE_URL" -O yosys.AppImage; then
            echo "AppImage not found for ${APPIMAGE_URL}. Skipping tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x yosys.AppImage
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download picorv32 source
        if: steps.download.outputs.skip != 'true'
        run: |
          wget -q https://raw.githubusercontent.com/YosysHQ/picorv32/master/picorv32.v

      - name: Create Synthesis Script
        if: steps.download.outputs.skip != 'true'
        run: |
          cat << 'EOF' > synth.ys
          read_verilog picorv32.v
          synth -top picorv32
          stat
          EOF

      - name: Test AppImage and Synthesize
        if: steps.download.outputs.skip != 'true'
        run: |
          ./yosys.AppImage --version
          ./yosys.AppImage -s synth.ys

      - name: Append Verification to Release
        if: steps.download.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: yosys-v${{ inputs.version }}
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          VERIFY_MSG="✅ **Verified**: Passed synthesis tests on \`${ARCH}\`."

          # Retry loop in case multiple architectures update simultaneously
          for i in 1 2 3 4 5; do
            BODY=$(gh release view "$TAG_NAME" --json body -q .body)

            if echo "$BODY" | grep -q "$VERIFY_MSG"; then
              echo "Verification message already exists for $ARCH."
              break
            fi

            if echo "$BODY" | grep -q "^### Notes"; then
              NEW_BODY=$(echo "$BODY" | awk -v msg="$VERIFY_MSG" '/^### Notes/ {print msg; print ""; print; next} {print}')
            else
              NEW_BODY="$BODY\n\n$VERIFY_MSG"
            fi

            echo -e "$NEW_BODY" > new_release_body.md

            if gh release edit "$TAG_NAME" --notes-file new_release_body.md; then
              echo "Successfully updated release notes."
              break
            else
              echo "Failed to update release notes. Retrying in 5s..."
              sleep 5
            fi
          done
