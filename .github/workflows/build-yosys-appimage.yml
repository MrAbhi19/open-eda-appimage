name: Build Yosys 0.69 AppImage

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APPIMAGE_NAME: "Yosys-0.69-x86_64.AppImage"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk git make python3 lld bison clang flex \
            libffi-dev libfl-dev libreadline-dev pkg-config \
            tcl-dev zlib1g-dev graphviz xdot \
            wget curl file desktop-file-utils \
            python3-pil
          sudo snap install cmake --classic

      - name: Download and extract Yosys 0.69
        run: |
          wget -q https://github.com/YosysHQ/yosys/releases/download/v0.69/yosys.tar.gz
          tar xf yosys.tar.gz
          test -f CMakeLists.txt && echo "Source looks good"

      - name: Configure Yosys with CMake
        run: |
          cmake -B build . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DYOSYS_WITHOUT_EDITLINE=ON \
            -DYOSYS_WITHOUT_SLANG=ON

      - name: Build Yosys
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Install Yosys into AppDir
        run: |
          cmake --install build --prefix AppDir/usr --strip
          ls -la AppDir/usr/bin/

      - name: Create .desktop file and 256x256 icon
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/yosys.desktop << 'EOF'
          [Desktop Entry]
          Name=Yosys
          Exec=yosys
          Icon=yosys
          Type=Application
          Categories=Development;Electronics;
          Terminal=true
          Comment=Yosys Open SYnthesis Suite
          EOF

          python3 -c '
          from PIL import Image
          img = Image.new("RGBA", (256, 256), (30, 100, 200, 255))
          img.save("AppDir/usr/share/icons/hicolor/256x256/apps/yosys.png", "PNG")
          print("256x256 icon created successfully")
          '

      - name: Download linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create the AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/yosys \
            --desktop-file AppDir/usr/share/applications/yosys.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/yosys.png \
            --output appimage

          if [ ! -f "${{ env.APPIMAGE_NAME }}" ]; then
            for f in *.AppImage; do
              case "$f" in
                linuxdeploy-*.AppImage) continue ;;
                *) mv "$f" "${{ env.APPIMAGE_NAME }}" ;;
              esac
            done
          fi

          ls -lh *.AppImage

      - name: Smoke test the AppImage
        run: |
          chmod +x "${{ env.APPIMAGE_NAME }}"
          ./"${{ env.APPIMAGE_NAME }}" -V

      - name: Compute SHA256 of the AppImage
        id: sha
        run: |
          HASH=$(sha256sum "${{ env.APPIMAGE_NAME }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA256: $HASH"

      - name: Write checksum file
        run: |
          sha256sum "${{ env.APPIMAGE_NAME }}" > "${{ env.APPIMAGE_NAME }}.sha256"
          cat "${{ env.APPIMAGE_NAME }}.sha256"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yosys-0.69-x86_64.AppImage
          path: |
            Yosys-*.AppImage
            Yosys-*.AppImage.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.69
          name: Yosys 0.69 AppImage
          overwrite_files: true
          body: |
            ## Yosys 0.69 - Linux x86_64 AppImage

            A standalone, portable AppImage of **Yosys 0.69** (the open-source
            RTL synthesis suite), built from the official upstream source tarball.

            ---

            ### What's inside

            - Yosys 0.69 - full synthesis toolchain
            - Built on Ubuntu 22.04 with Clang + LLVM
            - CMake Release build, binaries stripped
            - editline and slang disabled (kept small and portable)
            - All required shared libraries bundled via linuxdeploy

            ### Requirements

            - Linux x86_64
            - glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+, etc.)

            ### How to use

            ```
            # 1. Download Yosys-0.69-x86_64.AppImage from the Assets below

            # 2. Make it executable
            chmod +x Yosys-0.69-x86_64.AppImage

            # 3. Run it
            ./Yosys-0.69-x86_64.AppImage

            # Optional: pass Yosys flags directly
            ./Yosys-0.69-x86_64.AppImage -V
            ./Yosys-0.69-x86_64.AppImage -p "read_verilog design.v; synth; stat"
            ```

            ### Verify the download

            The SHA256 of Yosys-0.69-x86_64.AppImage is:

            ```
            ${{ steps.sha.outputs.hash }}
            ```

            To verify after downloading:

            ```
            sha256sum Yosys-0.69-x86_64.AppImage
            ```

            A Yosys-0.69-x86_64.AppImage.sha256 file is also attached to this
            release for automated verification:

            ```
            sha256sum -c Yosys-0.69-x86_64.AppImage.sha256
            ```

            ### Build transparency

            Built automatically by GitHub Actions from the official Yosys 0.69
            source tarball. Full build logs are available in the Actions tab
            of this repository.

            ---

            *Yosys is developed by the YosysHQ team and contributors. This is an unofficial repackaging - upstream project: https://github.com/YosysHQ/Yosys*
          files: |
            Yosys-*.AppImage
            Yosys-*.AppImage.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
