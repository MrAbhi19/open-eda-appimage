name: Build Yosys 0.69 AppImage

on:
  workflow_dispatch:          # still allows manual run
  push:
    branches: [ main ]        # also runs on every push to main (optional)

permissions:
  contents: write             # needed to create releases

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk git make python3 lld bison clang flex \
            libffi-dev libfl-dev libreadline-dev pkg-config \
            tcl-dev zlib1g-dev graphviz xdot \
            wget curl file desktop-file-utils \
            python3-pil

          sudo snap install cmake --classic

      - name: Download and extract Yosys 0.69
        run: |
          wget -q https://github.com/YosysHQ/yosys/releases/download/v0.69/yosys.tar.gz
          tar xf yosys.tar.gz
          test -f CMakeLists.txt && echo "Source looks good"

      - name: Configure Yosys with CMake
        run: |
          cmake -B build . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DYOSYS_WITHOUT_EDITLINE=ON \
            -DYOSYS_WITHOUT_SLANG=ON

      - name: Build Yosys
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Install Yosys into AppDir
        run: |
          cmake --install build --prefix AppDir/usr --strip

      - name: Create .desktop file and 256×256 icon
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/yosys.desktop << 'EOF'
          [Desktop Entry]
          Name=Yosys
          Exec=yosys
          Icon=yosys
          Type=Application
          Categories=Development;Electronics;
          Terminal=true
          Comment=Yosys Open SYnthesis Suite
          EOF

          python3 -c '
          from PIL import Image
          img = Image.new("RGBA", (256, 256), (30, 100, 200, 255))
          img.save("AppDir/usr/share/icons/hicolor/256x256/apps/yosys.png", "PNG")
          '

      - name: Download linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create the AppImage
        env:
          LDAI_OUTPUT: Yosys-0.69-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/yosys \
            --desktop-file AppDir/usr/share/applications/yosys.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/yosys.png \
            --output appimage
          ls -lh *.AppImage

      - name: Upload AppImage as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Yosys-0.69-x86_64.AppImage
          path: Yosys-0.69-x86_64.AppImage

      # ===== AUTOMATIC RELEASE =====
      - name: Create GitHub Release with AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.69
          name: Yosys 0.69 AppImage
          body: |
            Standalone AppImage of **Yosys 0.69** for Linux x86_64.

            Built completely from the official source tarball.
            Full transparent build logs are available in the Actions tab.

            ### How to use
            ```bash
            chmod +x Yosys-0.69-x86_64.AppImage
            ./Yosys-0.69-x86_64.AppImage
